<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Builder terminal</title>
  <desc id="desc">A terminal-style visual showing the product-building philosophy.</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="1" stop-color="#10151D"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="248" rx="20" fill="url(#b)" stroke="#FFFFFF" stroke-opacity=".12"/>
  <circle cx="31" cy="28" r="5" fill="#F04A23"/><circle cx="49" cy="28" r="5" fill="#FFD23F"/><circle cx="67" cy="28" r="5" fill="#21E6A2"/>
  <text x="600" y="33" text-anchor="middle" font-size="12" fill="#596477" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">builder.sh — 120×30</text>
  <line x1="22" y1="51" x2="1178" y2="51" stroke="#FFFFFF" stroke-opacity=".07"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <text x="34" y="88" fill="#697589">$</text><text x="56" y="88" fill="#ECF0F6">problem --find</text>
    <text x="56" y="116" fill="#9CA7B8">→ expensive, repetitive, annoying workflow</text>
    <text x="34" y="150" fill="#697589">$</text><text x="56" y="150" fill="#ECF0F6">product --remove-friction --add-clarity --ship</text>
    <text x="56" y="178" fill="#21E6A2">✓ useful first</text><text x="190" y="178" fill="#657083">•</text><text x="210" y="178" fill="#2B78FF">premium second</text><text x="350" y="178" fill="#657083">•</text><text x="370" y="178" fill="#F36B4A">iterate forever</text>
    <text x="34" y="216" fill="#697589">$</text><rect x="56" y="203" width="9" height="17" fill="#DDE4EF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
